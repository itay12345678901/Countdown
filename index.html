<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic & Holiday Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        appBg: '#090d16',
                        cardBg: '#161d2e',
                        cardSubBg: '#0f1422',
                        cardBorder: 'rgba(255, 255, 255, 0.12)',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .mesh-bg {
            background-image: 
                radial-gradient(at 10% 15%, rgba(99, 102, 241, 0.15) 0px, transparent 55%),
                radial-gradient(at 90% 85%, rgba(245, 158, 11, 0.12) 0px, transparent 55%),
                radial-gradient(at 50% 50%, rgba(9, 13, 22, 1) 0px, transparent 100%);
        }
        .glass-card {
            background: #161d2e;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .glass-subcard {
            background: #0f1422;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="mesh-bg flex flex-col justify-between items-center h-full w-full p-3 overflow-hidden">

    <!-- Header -->
    <header class="w-full max-w-sm flex items-center justify-between py-1 shrink-0">
        <div>
            <h1 class="font-display font-black text-xs uppercase tracking-widest text-indigo-400">Academic Schedule</h1>
            <p class="text-[11px] font-medium text-slate-300">Sept 1, 2026 - Jun 20, 2027</p>
        </div>
        <div class="flex items-center space-x-2 bg-[#161d2e] border border-slate-700/80 px-3 py-1 rounded-full shadow-lg">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span class="text-[10px] font-bold tracking-wider text-emerald-400 uppercase">Live</span>
        </div>
    </header>

    <!-- Main Centerpiece Container (Zero Scrolling, Uniform Card Width) -->
    <main class="w-full max-w-sm flex-1 flex flex-col justify-center space-y-3 my-auto min-h-0">
        
        <!-- Card 1: Academic Year Progress & Embedded Countdown to June 20, 2027 -->
        <div class="w-full glass-card rounded-2xl p-4 relative overflow-hidden flex flex-col justify-between">
            <!-- Decorative light blob -->
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="font-display font-bold text-[10px] tracking-wider uppercase text-indigo-400 block mb-0.5">Year Progress</span>
                    <div id="percentage-display" class="font-display font-black text-3xl sm:text-4xl tracking-tight text-white tabular-nums leading-none">0.000%</div>
                </div>
                <div class="text-right">
                    <span id="days-left-badge" class="font-semibold text-[10px] bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/40 tabular-nums">-- days left</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-[#0f1422] rounded-full h-3 p-0.5 border border-slate-700/80 relative overflow-hidden my-2">
                <div id="progress-bar-fill" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-400 h-full rounded-full transition-all duration-300 shadow-md shadow-indigo-500/50" style="width: 0%"></div>
            </div>

            <div class="flex justify-between text-[11px] text-slate-300 font-medium mb-2.5">
                <span>Elapsed: <strong id="days-passed" class="text-white font-semibold tabular-nums">0</strong> days</span>
                <span>Remaining: <strong id="days-remaining" class="text-white font-semibold tabular-nums">0</strong> days</span>
            </div>

            <!-- Embedded Live Countdown Timer to June 20, 2027 -->
            <div class="glass-subcard rounded-xl p-2.5 grid grid-cols-7 gap-1 text-center items-center">
                <div class="flex flex-col items-center justify-center">
                    <span id="term-days" class="font-display font-black text-base sm:text-lg text-indigo-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Days</span>
                </div>
                <div class="text-indigo-400 font-black text-sm flex items-center justify-center">:</div>
                <div class="flex flex-col items-center justify-center">
                    <span id="term-hours" class="font-display font-black text-base sm:text-lg text-indigo-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Hrs</span>
                </div>
                <div class="text-indigo-400 font-black text-sm flex items-center justify-center">:</div>
                <div class="flex flex-col items-center justify-center">
                    <span id="term-mins" class="font-display font-black text-base sm:text-lg text-indigo-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Min</span>
                </div>
                <div class="text-indigo-400 font-black text-sm flex items-center justify-center">:</div>
                <div class="flex flex-col items-center justify-center">
                    <span id="term-secs" class="font-display font-black text-base sm:text-lg text-cyan-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Sec</span>
                </div>
            </div>
        </div>

        <!-- Card 2: Dynamic Next Holiday Countdown (Auto-cycling correctly) -->
        <div class="w-full glass-card rounded-2xl p-4 relative overflow-hidden flex flex-col justify-between">
            <!-- Decorative light blob -->
            <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-amber-600/15 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex justify-between items-start mb-2.5">
                <div>
                    <span class="font-display font-bold text-[10px] tracking-wider uppercase text-amber-400 block mb-0.5">Next Holiday</span>
                    <h2 id="holiday-name" class="font-display font-extrabold text-base sm:text-lg text-white tracking-wide truncate max-w-[190px]">Loading...</h2>
                </div>
                <div class="text-right">
                    <span id="holiday-dates-badge" class="font-semibold text-[10px] bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/40">--</span>
                </div>
            </div>

            <!-- Holiday Countdown Ticker (Days, Hours, Minutes, Seconds) with Perfectly Centered Digits -->
            <div class="grid grid-cols-4 gap-2 mb-2.5">
                <div class="glass-subcard rounded-xl py-2 px-1 text-center flex flex-col items-center justify-center">
                    <span id="h-days" class="font-display font-black text-lg sm:text-xl text-amber-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Days</span>
                </div>
                <div class="glass-subcard rounded-xl py-2 px-1 text-center flex flex-col items-center justify-center">
                    <span id="h-hours" class="font-display font-black text-lg sm:text-xl text-amber-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Hrs</span>
                </div>
                <div class="glass-subcard rounded-xl py-2 px-1 text-center flex flex-col items-center justify-center">
                    <span id="h-mins" class="font-display font-black text-lg sm:text-xl text-amber-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Min</span>
                </div>
                <div class="glass-subcard rounded-xl py-2 px-1 text-center flex flex-col items-center justify-center">
                    <span id="h-secs" class="font-display font-black text-lg sm:text-xl text-cyan-300 block tabular-nums leading-none">00</span>
                    <span class="text-[8px] font-semibold text-slate-300 uppercase tracking-widest mt-1 block">Sec</span>
                </div>
            </div>

            <div class="flex justify-between items-center text-[11px] text-slate-300 pt-2 border-t border-slate-700/80">
                <span id="holiday-status-msg" class="font-medium text-slate-200">Status: Calculating...</span>
                <span class="font-semibold text-slate-400">Israel Education</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-sm pb-1 shrink-0 text-center">
        <div class="glass-subcard rounded-xl py-1.5 px-3 flex justify-between items-center text-[11px] text-slate-300">
            <span class="font-medium text-slate-300">Israeli High School Schedule</span>
            <span class="font-bold text-indigo-400">5787 (2026-2027)</span>
        </div>
    </footer>

    <script>
        // Official Israeli High School Holiday Schedule 2026-2027
        const holidays = [
            {
                name: "Rosh Hashanah",
                start: new Date(2026, 8, 11, 0, 0, 0),
                end: new Date(2026, 8, 13, 23, 59, 59),
                display: "Sept 11-13"
            },
            {
                name: "Yom Kippur & Sukkot",
                start: new Date(2026, 8, 20, 0, 0, 0),
                end: new Date(2026, 9, 5, 23, 59, 59),
                display: "Sept 20 - Oct 5"
            },
            {
                name: "Hanukkah",
                start: new Date(2026, 11, 6, 0, 0, 0),
                end: new Date(2026, 11, 12, 23, 59, 59),
                display: "Dec 6-12"
            },
            {
                name: "Purim",
                start: new Date(2027, 2, 23, 0, 0, 0),
                end: new Date(2027, 2, 24, 23, 59, 59),
                display: "Mar 23-24"
            },
            {
                name: "Passover (Pesach)",
                start: new Date(2027, 3, 13, 0, 0, 0),
                end: new Date(2027, 3, 28, 23, 59, 59),
                display: "Apr 13-28"
            },
            {
                name: "Independence Day",
                start: new Date(2027, 4, 12, 0, 0, 0),
                end: new Date(2027, 4, 12, 23, 59, 59),
                display: "May 12"
            },
            {
                name: "Shavuot",
                start: new Date(2027, 5, 10, 0, 0, 0),
                end: new Date(2027, 5, 11, 23, 59, 59),
                display: "Jun 10-11"
            },
            {
                name: "Summer Break",
                start: new Date(2027, 5, 21, 0, 0, 0),
                end: new Date(2027, 7, 31, 23, 59, 59),
                display: "From Jun 21"
            }
        ];

        function getAcademicTerm() {
            const start = new Date(2026, 8, 1, 0, 0, 0, 0); // September 1, 2026
            const end = new Date(2027, 5, 20, 23, 59, 59, 999); // June 20, 2027
            return { start, end };
        }

        function updateTracker() {
            const now = new Date();
            const term = getAcademicTerm();

            // 1. Academic Year Progress Calculation (3-decimal percentage)
            const totalDuration = term.end.getTime() - term.start.getTime();
            const elapsed = now.getTime() - term.start.getTime();
            let pct = (elapsed / totalDuration) * 100;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;

            document.getElementById('percentage-display').textContent = pct.toFixed(3) + '%';
            document.getElementById('progress-bar-fill').style.width = pct + '%';

            const diffToEnd = term.end.getTime() - now.getTime();
            const daysRemaining = Math.max(0, Math.ceil(diffToEnd / (1000 * 60 * 60 * 24)));
            const daysPassed = Math.max(0, Math.floor(elapsed / (1000 * 60 * 60 * 24)));

            document.getElementById('days-passed').textContent = daysPassed;
            document.getElementById('days-remaining').textContent = daysRemaining;
            document.getElementById('days-left-badge').textContent = daysRemaining + ' days left';

            // Embedded Countdown to June 20, 2027
            if (diffToEnd > 0) {
                const tDays = Math.floor(diffToEnd / (1000 * 60 * 60 * 24));
                const tHours = Math.floor((diffToEnd % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const tMins = Math.floor((diffToEnd % (1000 * 60 * 60)) / (1000 * 60));
                const tSecs = Math.floor((diffToEnd % (1000 * 60)) / 1000);

                document.getElementById('term-days').textContent = String(tDays).padStart(2, '0');
                document.getElementById('term-hours').textContent = String(tHours).padStart(2, '0');
                document.getElementById('term-mins').textContent = String(tMins).padStart(2, '0');
                document.getElementById('term-secs').textContent = String(tSecs).padStart(2, '0');
            } else {
                document.getElementById('term-days').textContent = '00';
                document.getElementById('term-hours').textContent = '00';
                document.getElementById('term-mins').textContent = '00';
                document.getElementById('term-secs').textContent = '00';
            }

            // 2. Dynamic Next Holiday Countdown (Correct chronological detection)
            let nextHoliday = null;
            for (let h of holidays) {
                if (now < h.end) {
                    nextHoliday = h;
                    break;
                }
            }
            if (!nextHoliday) {
                nextHoliday = holidays[holidays.length - 1];
            }

            document.getElementById('holiday-name').textContent = nextHoliday.name;
            document.getElementById('holiday-dates-badge').textContent = nextHoliday.display;

            const holidayDurationDays = Math.round((nextHoliday.end.getTime() - nextHoliday.start.getTime()) / (1000 * 60 * 60 * 24)) + 1;

            if (now >= nextHoliday.start && now <= nextHoliday.end) {
                document.getElementById('h-days').textContent = '00';
                document.getElementById('h-hours').textContent = '00';
                document.getElementById('h-mins').textContent = '00';
                document.getElementById('h-secs').textContent = '00';
                document.getElementById('holiday-status-msg').textContent = 'Status: Holiday in progress';
            } else {
                const holidayDiff = nextHoliday.start.getTime() - now.getTime();
                if (holidayDiff > 0) {
                    const hDays = Math.floor(holidayDiff / (1000 * 60 * 60 * 24));
                    const hHours = Math.floor((holidayDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const hMins = Math.floor((holidayDiff % (1000 * 60 * 60)) / (1000 * 60));
                    const hSecs = Math.floor((holidayDiff % (1000 * 60)) / 1000);

                    document.getElementById('h-days').textContent = String(hDays).padStart(2, '0');
                    document.getElementById('h-hours').textContent = String(hHours).padStart(2, '0');
                    document.getElementById('h-mins').textContent = String(hMins).padStart(2, '0');
                    document.getElementById('h-secs').textContent = String(hSecs).padStart(2, '0');
                    document.getElementById('holiday-status-msg').textContent = `Duration: ${holidayDurationDays} day${holidayDurationDays > 1 ? 's' : ''}`;
                } else {
                    document.getElementById('h-days').textContent = '00';
                    document.getElementById('h-hours').textContent = '00';
                    document.getElementById('h-mins').textContent = '00';
                    document.getElementById('h-secs').textContent = '00';
                    document.getElementById('holiday-status-msg').textContent = 'Status: Completed';
                }
            }
        }

        function loop() {
            updateTracker();
            requestAnimationFrame(loop);
        }

        window.onload = function() {
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
