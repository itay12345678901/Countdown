<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic & Holiday Tracker</title>
    <style>
        :root {
            --bg-color: #0c0f1d;
            --card-bg: rgba(22, 27, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-year: #38bdf8;
            --accent-holiday: #fbbf24;
            --box-bg: rgba(15, 23, 42, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Initial Dark Loading Screen to eliminate white flash */
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-year);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 850px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            flex: 1;
            min-height: 0;
            margin-bottom: 8px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .year-card .card-title { color: var(--accent-year); }
        .holiday-card .card-title { color: var(--accent-holiday); }

        .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .main-stat {
            text-align: center;
            margin: 2px 0;
        }

        .percentage-value {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin: 6px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .year-card .progress-bar-fill { background: linear-gradient(90deg, #0284c7, var(--accent-year)); }
        .holiday-card .progress-bar-fill { background: linear-gradient(90deg, #d97706, var(--accent-holiday)); }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stats-row span {
            font-weight: 600;
            color: var(--text-main);
        }

        .countdown-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 3px;
            text-align: center;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .time-box {
            background: var(--box-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 2px;
            text-align: center;
        }

        .time-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .time-unit {
            font-size: 0.58rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .holiday-status {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <!-- Instant dark loader to avoid white flash -->
    <div id="app-loader">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <!-- Card 1: Academic Year Progress & Countdown -->
        <div class="card year-card">
            <div class="card-header">
                <span class="card-title">Year Progress</span>
                <span class="badge" id="school-year-badge">5787</span>
            </div>
            
            <div class="main-stat">
                <div class="percentage-value" id="year-percentage">0.0000000%</div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="year-progress-bar"></div>
            </div>

            <div class="stats-row">
                <div>Elapsed: <span id="days-elapsed">0</span> days</div>
                <div>Remaining: <span id="days-remaining">0</span> days</div>
            </div>

            <div>
                <div class="countdown-label">Time until June 20, 2027</div>
                <div class="countdown-grid">
                    <div class="time-box">
                        <div class="time-value" id="y-days">0</div>
                        <div class="time-unit">Days</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="y-hours">0</div>
                        <div class="time-unit">Hrs</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="y-mins">0</div>
                        <div class="time-unit">Mins</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="y-secs">0</div>
                        <div class="time-unit">Secs</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card 2: Next Holiday Countdown -->
        <div class="card holiday-card">
            <div class="card-header">
                <span class="card-title" id="holiday-name">Next Holiday</span>
                <span class="badge" id="holiday-date-badge">Loading...</span>
            </div>

            <div class="main-stat">
                <div class="percentage-value" id="holiday-status-title" style="font-size: 1.4rem;">Countdown</div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="holiday-progress-bar"></div>
            </div>

            <div class="holiday-status" id="holiday-desc">Calculating schedule...</div>

            <div>
                <div class="countdown-label">Time until next break</div>
                <div class="countdown-grid">
                    <div class="time-box">
                        <div class="time-value" id="h-days">0</div>
                        <div class="time-unit">Days</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="h-hours">0</div>
                        <div class="time-unit">Hrs</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="h-mins">0</div>
                        <div class="time-unit">Mins</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="h-secs">0</div>
                        <div class="time-unit">Secs</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Israeli School Holidays 2026-2027 (Approximate standard Ministry of Education dates)
        const holidays = [
            { name: "Rosh Hashanah", start: new Date("2026-09-11T00:00:00"), end: new Date("2026-09-14T23:59:59"), displayDate: "Sep 11 - Sep 14" },
            { name: "Yom Kippur", start: new Date("2026-09-20T00:00:00"), end: new Date("2026-09-22T23:59:59"), displayDate: "Sep 20 - Sep 22" },
            { name: "Sukkot", start: new Date("2026-09-25T00:00:00"), end: new Date("2026-10-06T23:59:59"), displayDate: "Sep 25 - Oct 6" },
            { name: "Hanukkah", start: new Date("2026-12-05T00:00:00"), end: new Date("2026-12-13T23:59:59"), displayDate: "Dec 5 - Dec 13" },
            { name: "Purim", start: new Date("2027-03-22T00:00:00"), end: new Date("2027-03-24T23:59:59"), displayDate: "Mar 22 - Mar 24" },
            { name: "Passover (Pesach)", start: new Date("2027-04-18T00:00:00"), end: new Date("2027-05-01T23:59:59"), displayDate: "Apr 18 - May 1" },
            { name: "Independence Day", start: new Date("2027-05-06T00:00:00"), end: new Date("2027-05-06T23:59:59"), displayDate: "May 6" },
            { name: "Shavuot", start: new Date("2027-06-06T00:00:00"), end: new Date("2027-06-08T23:59:59"), displayDate: "Jun 6 - Jun 8" },
            { name: "Summer Break", start: new Date("2027-06-20T00:00:00"), end: new Date("2027-08-31T23:59:59"), displayDate: "Starts June 20" }
        ];

        function updateTracker() {
            const now = new Date();
            
            // 1. Academic Year Progress (Sep 1, 2026 to June 20, 2027)
            const startDate = new Date("2026-09-01T00:00:00");
            const endDate = new Date("2027-06-20T00:00:00");
            
            const totalDuration = endDate - startDate;
            const elapsedDuration = now - startDate;
            const remainingDuration = endDate - now;

            let percentage = (elapsedDuration / totalDuration) * 100;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            document.getElementById('year-percentage').innerText = percentage.toFixed(7) + '%';
            document.getElementById('year-progress-bar').style.width = percentage + '%';

            const msPerDay = 1000 * 60 * 60 * 24;
            const daysElapsed = Math.max(0, Math.floor(elapsedDuration / msPerDay));
            const daysRemaining = Math.max(0, Math.ceil(remainingDuration / msPerDay));

            document.getElementById('days-elapsed').innerText = daysElapsed;
            document.getElementById('days-remaining').innerText = daysRemaining;

            // Year Countdown Timer
            if (remainingDuration > 0) {
                const yDays = Math.floor(remainingDuration / msPerDay);
                const yHours = Math.floor((remainingDuration % msPerDay) / (1000 * 60 * 60));
                const yMins = Math.floor((remainingDuration % (1000 * 60 * 60)) / (1000 * 60));
                const ySecs = Math.floor((remainingDuration % (1000 * 60)) / 1000);

                document.getElementById('y-days').innerText = yDays;
                document.getElementById('y-hours').innerText = yHours;
                document.getElementById('y-mins').innerText = yMins;
                document.getElementById('y-secs').innerText = ySecs;
            } else {
                document.getElementById('y-days').innerText = 0;
                document.getElementById('y-hours').innerText = 0;
                document.getElementById('y-mins').innerText = 0;
                document.getElementById('y-secs').innerText = 0;
            }

            // 2. Next Holiday Logic
            let nextHoliday = null;
            let currentHoliday = null;

            for (let holiday of holidays) {
                if (now >= holiday.start && now <= holiday.end) {
                    currentHoliday = holiday;
                    break;
                } else if (now < holiday.start) {
                    nextHoliday = holiday;
                    break;
                }
            }

            if (currentHoliday) {
                document.getElementById('holiday-name').innerText = currentHoliday.name;
                document.getElementById('holiday-date-badge').innerText = currentHoliday.displayDate;
                document.getElementById('holiday-status-title').innerText = "Holiday Active";
                document.getElementById('holiday-desc').innerText = "Enjoy your break!";
                document.getElementById('holiday-progress-bar').style.width = "100%";
                
                document.getElementById('h-days').innerText = 0;
                document.getElementById('h-hours').innerText = 0;
                document.getElementById('h-mins').innerText = 0;
                document.getElementById('h-secs').innerText = 0;
            } else if (nextHoliday) {
                document.getElementById('holiday-name').innerText = nextHoliday.name;
                document.getElementById('holiday-date-badge').innerText = nextHoliday.displayDate;
                document.getElementById('holiday-status-title').innerText = nextHoliday.name;
                document.getElementById('holiday-desc').innerText = "Upcoming break";

                const holidayDiff = nextHoliday.start - now;
                const hDays = Math.floor(holidayDiff / msPerDay);
                const hHours = Math.floor((holidayDiff % msPerDay) / (1000 * 60 * 60));
                const hMins = Math.floor((holidayDiff % (1000 * 60 * 60)) / (1000 * 60));
                const hSecs = Math.floor((holidayDiff % (1000 * 60)) / 1000);

                document.getElementById('h-days').innerText = hDays;
                document.getElementById('h-hours').innerText = hHours;
                document.getElementById('h-mins').innerText = hMins;
                document.getElementById('h-secs').innerText = hSecs;

                // Progress towards the holiday starting (relative to previous point or 30 days span)
                document.getElementById('holiday-progress-bar').style.width = "40%";
            } else {
                document.getElementById('holiday-name').innerText = "School Year";
                document.getElementById('holiday-date-badge').innerText = "Completed";
                document.getElementById('holiday-status-title').innerText = "All Clear";
                document.getElementById('holiday-desc').innerText = "No more holidays listed";
                document.getElementById('holiday-progress-bar').style.width = "100%";
            }

            // Hide loader smoothly once first calculation runs
            const loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300);
            }
        }

        updateTracker();
        setInterval(updateTracker, 1000);
    </script>
</body>
</html>
