<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Progress & Countdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131c2e',
                        cardBorder: '#1e293b',
                        accentGlow: '#6366f1',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
        }
        /* Custom smooth glowing aura */
        .glow-aura {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
        }
        /* Radial gradient background accent */
        .bg-radial-gradient {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 70%);
        }
    </style>
</head>
<body class="bg-radial-gradient flex flex-col justify-between items-center h-full w-full p-4 overflow-hidden">

    <!-- Top Header -->
    <header class="w-full max-w-sm flex items-center justify-between pt-2 pb-1 shrink-0">
        <div>
            <h1 class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">Academic Term</h1>
            <p class="text-sm font-medium text-slate-300">Sep 1 – Jun 20</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full shadow-inner">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span id="live-status" class="text-xs font-medium text-emerald-400 tracking-wide">Live Tracker</span>
        </div>
    </header>

    <!-- Main Centerpiece Container -->
    <main class="w-full max-w-sm flex-1 flex flex-col items-center justify-center my-auto min-h-0">
        <div class="w-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 shadow-2xl glow-aura flex flex-col items-center relative overflow-hidden">
            
            <!-- Subtle background lighting element -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Percentage Display -->
            <div class="text-center z-10 mb-5">
                <span class="text-xs font-medium uppercase tracking-widest text-slate-400 block mb-1">Elapsed Progress</span>
                <div class="flex items-baseline justify-center">
                    <span id="percentage-display" class="text-4xl sm:text-5xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent">0.0000000%</span>
                </div>
            </div>

            <!-- Circular Progress Ring / Visualizer -->
            <div class="relative w-40 h-40 flex items-center justify-center my-1 z-10">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
                    <!-- Track background -->
                    <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-width="8" class="text-slate-800/80" fill="none" />
                    <!-- Progress Arc -->
                    <circle id="progress-ring" cx="60" cy="60" r="50" stroke="url(#progress-gradient)" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="314.159" stroke-dashoffset="314.159" style="transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);" />
                    <!-- Gradient definition -->
                    <defs>
                        <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6366f1" />
                            <stop offset="50%" stop-color="#8b5cf6" />
                            <stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                </svg>
                <!-- Inner pill / icon -->
                <div class="absolute flex flex-col items-center justify-center text-center">
                    <svg class="w-6 h-6 text-indigo-400 mb-0.5 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="days-left-badge" class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Calculating</span>
                </div>
            </div>

            <!-- Mini stats row -->
            <div class="grid grid-cols-2 gap-3 w-full mt-5 z-10">
                <div class="bg-slate-950/40 border border-slate-800/60 rounded-2xl p-2.5 text-center">
                    <span class="text-[10px] uppercase font-semibold text-slate-400 block">Days Passed</span>
                    <span id="days-passed" class="text-base font-bold text-slate-200">0</span>
                </div>
                <div class="bg-slate-950/40 border border-slate-800/60 rounded-2xl p-2.5 text-center">
                    <span class="text-[10px] uppercase font-semibold text-slate-400 block">Days Remaining</span>
                    <span id="days-remaining" class="text-base font-bold text-slate-200">0</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Breakdown Countdown Ticker Footer -->
    <footer class="w-full max-w-sm pb-2 shrink-0">
        <div class="bg-slate-900/40 border border-slate-800/60 rounded-2xl p-3 flex justify-around items-center text-center">
            <div>
                <span id="hours-val" class="text-sm font-bold text-indigo-300 block">00</span>
                <span class="text-[9px] uppercase tracking-widest text-slate-400">Hours</span>
            </div>
            <div class="text-slate-700 font-bold">:</div>
            <div>
                <span id="mins-val" class="text-sm font-bold text-indigo-300 block">00</span>
                <span class="text-[9px] uppercase tracking-widest text-slate-400">Minutes</span>
            </div>
            <div class="text-slate-700 font-bold">:</div>
            <div>
                <span id="secs-val" class="text-sm font-bold text-indigo-300 block">00</span>
                <span class="text-[9px] uppercase tracking-widest text-slate-400">Seconds</span>
            </div>
            <div class="text-slate-700 font-bold">:</div>
            <div>
                <span id="millis-val" class="text-sm font-bold text-cyan-300 block">000</span>
                <span class="text-[9px] uppercase tracking-widest text-slate-400">Millis</span>
            </div>
        </div>
        <div class="text-center mt-2">
            <span class="text-[10px] text-slate-500">Target Date: June 20, <span id="target-year">2027</span></span>
        </div>
    </footer>

    <script>
        // Calculate academic year dates dynamically
        function getAcademicDates(now) {
            const currentYear = now.getFullYear();
            let startYear = currentYear;
            let endYear = currentYear + 1;

            // If current date is before September 1st, the academic year started previous year
            const tempStartThisYear = new Date(currentYear, 8, 1, 0, 0, 0, 0); // Sep 1
            if (now < tempStartThisYear) {
                startYear = currentYear - 1;
                endYear = currentYear;
            }

            const startDate = new Date(startYear, 8, 1, 0, 0, 0, 0); // September 1st
            const endDate = new Date(endYear, 5, 20, 23, 59, 59, 999); // June 20th

            return { startDate, endDate, endYear };
        }

        const circumference = 2 * Math.PI * 50; // Radius is 50 -> ~314.159

        function updateTracker() {
            const now = new Date();
            const { startDate, endDate, endYear } = getAcademicDates(now);

            document.getElementById('target-year').textContent = endYear;

            const totalDuration = endDate.getTime() - startDate.getTime();
            const elapsed = now.getTime() - startDate.getTime();

            let percentage = (elapsed / totalDuration) * 100;
            
            // Clamp percentage between 0 and 100 for display safety
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            // Format unrounded percentage with 7 decimal places for smooth real-time decimal rolling
            document.getElementById('percentage-display').textContent = percentage.toFixed(7) + '%';

            // Update circular ring offset
            const ring = document.getElementById('progress-ring');
            const offset = circumference - (percentage / 100) * circumference;
            ring.style.strokeDashoffset = offset;

            // Days calculation
            const diffToEnd = endDate.getTime() - now.getTime();
            const daysRemaining = Math.max(0, Math.ceil(diffToEnd / (1000 * 60 * 60 * 24)));
            const daysPassed = Math.max(0, Math.floor(elapsed / (1000 * 60 * 60 * 24)));

            document.getElementById('days-passed').textContent = daysPassed;
            document.getElementById('days-remaining').textContent = daysRemaining;
            document.getElementById('days-left-badge').textContent = daysRemaining + 'd left';

            // Live remaining time components
            if (diffToEnd > 0) {
                const hours = Math.floor((diffToEnd % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diffToEnd % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diffToEnd % (1000 * 60)) / 1000);
                const millis = Math.floor(diffToEnd % 1000);

                document.getElementById('hours-val').textContent = String(hours).padStart(2, '0');
                document.getElementById('mins-val').textContent = String(minutes).padStart(2, '0');
                document.getElementById('secs-val').textContent = String(seconds).padStart(2, '0');
                document.getElementById('millis-val').textContent = String(millis).padStart(3, '0');
                document.getElementById('live-status').textContent = 'Live Tracker';
            } else {
                document.getElementById('hours-val').textContent = '00';
                document.getElementById('mins-val').textContent = '00';
                document.getElementById('secs-val').textContent = '00';
                document.getElementById('millis-val').textContent = '000';
                document.getElementById('live-status').textContent = 'Term Completed';
            }
        }

        // Run immediately and update via requestAnimationFrame for ultra-smooth real-time decimal counting
        function frameLoop() {
            updateTracker();
            requestAnimationFrame(frameLoop);
        }

        window.onload = function() {
            requestAnimationFrame(frameLoop);
        };
    </script>
</body>
</html>
